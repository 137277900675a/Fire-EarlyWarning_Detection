# 火焰烟雾检测超参数配置
# 这些是 Ultralytics YOLOv8 使用的默认超参数
# 可以通过 train_config.yaml 覆盖

lr0: 0.01                        # 初始学习率
lrf: 0.01                       # 最终学习率因子
momentum: 0.937                 # SGD动量/Adam beta1
weight_decay: 0.0005            # 优化器权重衰减
warmup_epochs: 3.0              # 预热轮数
warmup_momentum: 0.8            # 预热动量
warmup_bias_lr: 0.1             # 预热偏置学习率
box: 7.5                        # 边界框损失增益
cls: 0.5                        # 分类损失增益
dfl: 1.5                       # DFL损失增益
pose: 12.0                     # 姿态损失增益
kobj: 2.0                      # 关键点目标损失增益
label_smoothing: 0.0          # 标签平滑 epsilon
nbs: 64                       # 标称批次大小
hsv_h: 0.015                  # HSV-色调增强
hsv_s: 0.7                    # HSV-饱和度增强
hsv_v: 0.4                    # HSV-值增强
degrees: 0.0                  # 旋转角度
translate: 0.1                # 平移
scale: 0.5                    # 缩放
shear: 0.0                   # 剪切
perspective: 0.0             # 透视
flipud: 0.0                 # 上下翻转
fliplr: 0.5                 # 左右翻转
mosaic: 1.0                 # 马赛克增强
mixup: 0.0                  # MixUp增强
copy_paste: 0.0             # 复制粘贴增强
autosplit: False            # 自动分割数据集
