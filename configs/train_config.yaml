# 火焰烟雾检测训练配置文件
# YOLO模型训练参数

# 模型配置
model: yolov8s                    # 模型变体: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
pretrained: true                  # 使用预训练权重

# 数据集配置
data: data/dataset.yaml           # 数据集配置文件路径
task: detect                      # 任务类型: detect, segment, classify

# 训练超参数
epochs: 300                       # 训练轮数
patience: 50                      # 早停耐心值
batch: 32                        # 批次大小
imgsz: 640                       # 输入图像尺寸
lr0: 0.005                       # 初始学习率
lrf: 0.01                        # 最终学习率因子
momentum: 0.937                   # SGD动量
weight_decay: 0.0005             # 优化器权重衰减
warmup_epochs: 3.0               # 预热轮数
warmup_momentum: 0.8             # 预热动量
warmup_bias_lr: 0.1              # 预热偏置学习率

# 数据增强
hsv_h: 0.015                     # HSV-色调增强
hsv_s: 0.7                       # HSV-饱和度增强
hsv_v: 0.4                       # HSV-值增强
degrees: 0.0                     # 旋转角度
translate: 0.1                   # 平移
scale: 0.5                       # 缩放
shear: 0.0                       # 剪切
perspective: 0.0                 # 透视
flipud: 0.0                     # 上下翻转
fliplr: 0.5                     # 左右翻转
mosaic: 1.0                     # 马赛克增强
mixup: 0.0                      # MixUp增强
copy_paste: 0.0                  # 复制粘贴增强

# 训练设置
device: ''                        # 设备: cuda或cpu (留空自动检测)
workers: 8                       # 数据加载器工作进程数
project: runs/train              # 项目目录
name: fire_smoke_exp             # 实验名称
exist_ok: false                  # 覆盖现有实验
verbose: true                    # 详细输出
seed: 0                          # 随机种子
deterministic: true              # 确定性训练
single_cls: false               # 单类训练
rect: false                     # 矩形训练
cos_lr: false                    # 余弦学习率
close_mosaic: 10                 # 最后N轮禁用马赛克
resume: false                    # 从上次检查点恢复训练
amp: true                        # 自动混合精度
fraction: 1.0                   # 训练比例
profile: false                   # Profile ONNX和TensorRT速度
freeze: None                     # 冻结层
# 多尺度设置
multi_scale: false               # 多尺度训练
# 图像尺寸可以是列表[h, w]用于矩形训练
